name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - ".payload/**"
      - "launcher.py"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rebuild compiled payload
        shell: pwsh
        run: |
          $p1 = Get-Content ".payload/part1.txt" -Raw
          $p2 = Get-Content ".payload/part2.txt" -Raw
          $p3 = Get-Content ".payload/part3.txt" -Raw
          $b64 = $p1 + $p2 + $p3
          [IO.File]::WriteAllBytes("app_payload.bin", [Convert]::FromBase64String($b64))

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter pygame

      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Christmas Player 1000" --collect-all customtkinter --collect-all pygame --hidden-import tkinter --hidden-import tkinter.filedialog --hidden-import tkinter.messagebox --add-data "app_payload.bin;." launcher.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Christmas-Player-1000-Windows
          path: "dist/Christmas Player 1000.exe"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "dist/Christmas Player 1000.exe"
          gh release view v1.0.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.0.0 $asset --clobber
          } else {
            gh release create v1.0.0 $asset --title "Christmas Player 1000 v1.0.0" --notes "Windows kiadás. A publikus repó nem tartalmazza az olvasható Python forráskódot."
          }
